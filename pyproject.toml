[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rides-telemetry-platform"
version = "0.6.0"
description = "Real-time rides telemetry: Kafka + Kinesis streaming ingestion, Structured Streaming to Delta, geospatial gold marts, deployed on AWS + Databricks + Kubernetes."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Bapuji Dirisala", email = "dirisala.bapuji@gmail.com" },
]
keywords = ["data-engineering", "streaming", "kafka", "kinesis", "spark", "delta-lake", "geospatial"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
generator = [
    "pydantic>=2.7",
    "pyarrow>=17.0",
    "httpx>=0.27",
    # Optional at runtime — used by the CLI when --use-system-trust-store
    # is set, so downloads work behind corporate TLS-inspecting proxies
    # (Zscaler, Netskope, etc.) without disabling verification.
    "truststore>=0.9",
]
producer = [
    "confluent-kafka>=2.5",
]
spark = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    # H3 geospatial indexing — pushed through a pandas_udf in
    # rides_telemetry.geo.spark.h3_index_of_expr. There's no native
    # Java implementation of H3 in Spark; pandas_udf gives us
    # vectorised (Arrow-batched) execution without a Java UDF.
    "h3>=4.0,<5",
]
aws = [
    "boto3>=1.35",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/bapuji-dirisala/rides-telemetry-platform"

[tool.hatch.build.targets.wheel]
packages = ["src/rides_telemetry"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
# Deselect slow / infra-dependent tests by default. Opt in with
# ``pytest -m spark`` or ``pytest -m integration``.
addopts = "-v --strict-markers -m 'not spark and not integration'"
markers = [
    "spark: requires a local Spark session (JDK 11/17 + pyspark)",
    "integration: hits a real broker or external service",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "lakehouse", "notebooks", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long — formatter handles it
    "N812",  # lowercase imported as non-lowercase — pyspark.sql.functions as F is convention
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
